name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @cocally/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm --filter @cocally/shared test && pnpm --filter @cocally/api test

      - name: Build web
        run: pnpm --filter @cocally/web build

      - name: Build API
        run: pnpm --filter @cocally/api build
