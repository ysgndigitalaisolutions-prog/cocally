name: CI

on:
  push:
    branches: [main, prod]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cocally/shared build
      - run: pnpm typecheck
      - run: pnpm --filter @cocally/shared test && pnpm --filter @cocally/api test
      - run: pnpm --filter @cocally/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: pnpm --filter @cocally/api build

  worker:
    name: Python worker
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: agent-worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile agent.py

  images:
    name: Docker build (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [node, worker]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api,    file: apps/api/Dockerfile,     context: . }
          - { name: web,    file: apps/web/Dockerfile,     context: . }
          - { name: worker, file: agent-worker/Dockerfile, context: agent-worker }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://app.example.com
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
