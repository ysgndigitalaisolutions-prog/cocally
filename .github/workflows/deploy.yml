# Ships the prod branch to the Compute Engine VM created by deploy/gcp/setup.sh:
# test -> build and push images to GHCR -> ssh through IAP (keyless, via
# Workload Identity Federation) -> compose pull/up -> health gate.
#
# Repository variables (set by setup.sh): DEPLOY_TARGET=vm, GCP_PROJECT_ID,
#   GCP_ZONE, GCP_WIF_PROVIDER, GCP_DEPLOYER_SA, VM_NAME, APP_DOMAIN
# No repository secrets are needed.
name: Deploy (VM)

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  test:
    name: Typecheck and test
    if: ${{ vars.DEPLOY_TARGET == 'vm' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cocally/shared build
      - run: pnpm typecheck
      - run: pnpm --filter @cocally/shared test && pnpm --filter @cocally/api test

  build:
    name: Build and push (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: api,    file: apps/api/Dockerfile,     context: . }
          - { name: web,    file: apps/web/Dockerfile,     context: . }
          - { name: worker, file: agent-worker/Dockerfile, context: agent-worker }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/cocally-${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/cocally-${{ matrix.name }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ vars.APP_DOMAIN }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Copy stack files
        run: |
          gcloud compute scp --project "${{ vars.GCP_PROJECT_ID }}" --zone "${{ vars.GCP_ZONE }}" --tunnel-through-iap --quiet \
            deploy/docker-compose.prod.yml deploy/Caddyfile deploy/backup-mongo.sh "${{ vars.VM_NAME }}":/opt/cocally/
      - name: Pull and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          gcloud compute ssh "${{ vars.VM_NAME }}" --project "${{ vars.GCP_PROJECT_ID }}" --zone "${{ vars.GCP_ZONE }}" --tunnel-through-iap --quiet --command "
            set -euo pipefail
            cd /opt/cocally
            echo '$GHCR_TOKEN' | sudo docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null
            export IMAGE_TAG='$IMAGE_TAG'
            sudo -E docker compose --env-file .env.prod -f docker-compose.prod.yml pull --quiet
            sudo -E docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --remove-orphans
            sudo docker logout ghcr.io >/dev/null
            sudo docker image prune -f >/dev/null
          "
      - name: Health gate
        run: |
          for i in $(seq 1 36); do
            if curl -fsS "https://${{ vars.APP_DOMAIN }}/api/v1/ops/ready"; then echo; echo "ready"; exit 0; fi
            sleep 5
          done
          echo "API did not become ready"; exit 1
