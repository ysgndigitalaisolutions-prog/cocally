# Production stack for one VM. Usage (on the VM, in /opt/cocally):
#   docker compose --env-file .env.prod -f docker-compose.prod.yml pull
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
# Images are built by .github/workflows/deploy.yml and pushed to GHCR.
name: cocally-prod

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
    <<: *logging

  api:
    image: ${IMAGE_REGISTRY}/cocally-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
      PORT: "4000"
      TRUST_PROXY: "true"
      # MongoDB Atlas. No local fallback: a silent local database is how data goes missing.
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI must be set in .env.prod}
      CORS_ORIGIN: https://${DOMAIN}
      PUBLIC_BASE_URL: https://${DOMAIN}
      RECORDINGS_DIR: /app/recordings-data
    volumes:
      - recordings:/app/recordings-data
    <<: *logging

  web:
    image: ${IMAGE_REGISTRY}/cocally-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on: [api]
    <<: *logging

  worker:
    image: ${IMAGE_REGISTRY}/cocally-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      ENGINE_BASE_URL: http://api:4000/api/v1
    depends_on:
      api: { condition: service_healthy }
    <<: *logging

volumes:
  recordings:
  caddy_data:
  caddy_config:
